name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Generate Langium parser
        run: bun run langium:generate

      - name: Type-check
        run: bun run check

      - name: Test
        run: bun test

      - name: Check examples
        run: bun run check:examples

      - name: Render and execute on SQLite (in-process)
        run: bun run validate:sqlite

  dialects:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: tetaue
          POSTGRES_USER: tetaue
          POSTGRES_DB: tetaue
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tetaue"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tetaue
          MYSQL_USER: tetaue
          MYSQL_PASSWORD: tetaue
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h localhost -ptetaue"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Set up PostgreSQL schema
        run: |
          PGPASSWORD=tetaue psql -h localhost -U tetaue -d tetaue <<'SQL'
          CREATE TABLE users (id int, name text, age int, active bool, email text, nickname text, last_seen timestamp);
          CREATE TABLE orders (id int, user_id int, total float8, status text);
          INSERT INTO users VALUES (1, 'Ada', 37, true, 'ada@example.com', NULL, now());
          INSERT INTO orders VALUES (10, 1, 99.5, 'paid');
          SQL

      - name: Render + execute on PostgreSQL
        run: |
          bun run src/cli.ts render examples/orders.tetaue --dialect postgresql > /tmp/orders.sql
          PGPASSWORD=tetaue psql -h localhost -U tetaue -d tetaue -v ON_ERROR_STOP=1 -f /tmp/orders.sql

      - name: Set up MySQL schema
        run: |
          mysql -h 127.0.0.1 -utetaue -ptetaue tetaue <<'SQL'
          CREATE TABLE users (id INT, name VARCHAR(100), age INT, active BOOLEAN, email VARCHAR(100), nickname VARCHAR(100), last_seen TIMESTAMP);
          CREATE TABLE orders (id INT, user_id INT, total DOUBLE, status VARCHAR(20));
          INSERT INTO users VALUES (1, 'Ada', 37, TRUE, 'ada@example.com', NULL, NOW());
          INSERT INTO orders VALUES (10, 1, 99.5, 'paid');
          SQL

      - name: Render + execute on MySQL
        run: |
          bun run src/cli.ts render examples/orders.tetaue --dialect mysql > /tmp/orders-mysql.sql
          mysql -h 127.0.0.1 -utetaue -ptetaue tetaue < /tmp/orders-mysql.sql

  dialect-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Render and syntax-check all dialects
        run: bun run scripts/validate-dialects.ts
