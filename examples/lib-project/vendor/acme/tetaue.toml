# acme's own manifest — a library may declare ITS dependencies, and they
# travel with the folder. `shared` is pinned relative to acme, so sharing
# the acme folder shares its dependency too (and two libs could pin
# different versions by pointing at different paths).
#
# Because this file exists, acme is self-contained: its imports resolve
# against THIS manifest, not the importing project's.

[dependencies]
shared = { path = "../shared" }
