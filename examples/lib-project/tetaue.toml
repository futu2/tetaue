# The project manifest — everything this project imports is declared here.
#
# A "tetaue project" is any folder with a tetaue.toml. `import` resolves
# relative to the importing file first, then against these named
# dependencies (path = "…" is relative to THIS file). Nothing global, no
# environment variables: clone or copy a lib into the project and declare
# it here.
#
#   tetaue render main.tetaue        # from this folder

[dependencies]
acme   = { path = "vendor/acme" }
shared = { path = "vendor/shared" }
